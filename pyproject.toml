[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aubergine"
dynamic = ["version"]
description = "MSA-based variant calling and disagreement analysis for sets of consensus genomes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sam Wilkinson", email = "s.a.j.wilkinson@bham.ac.uk" }]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff"]

[project.scripts]
aubergine = "aubergine.cli:main"

[tool.hatch.version]
path = "src/aubergine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aubergine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
